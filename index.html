<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Horizon Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body {
            background: #0b0d17;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at center, #1a1d36 0%, #0b0d17 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        h2 { color: #a855f7; text-align: center; font-weight: 800; letter-spacing: 1px; }
        
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #94a3b8; font-weight: 600; }

        input, select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #151828;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        select option { background: #151828; color: #fff; }

        button {
            padding: 14px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; width: 0%; background: #a855f7; transition: width 0.2s; }
        .status { font-size: 13px; color: #94a3b8; text-align: center; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ HORIZON LAUNCHER</h2>
        
        <div class="input-group">
            <label>Никнейм:</label>
            <input type="text" id="username" value="PixelKate" placeholder="Ваш ник">
        </div>

        <div class="input-group">
            <label>Версия игры:</label>
            <select id="versionSelect">
                <option value="">Загрузка версий с GitHub CDN...</option>
            </select>
        </div>

        <button id="playBtn" onclick="onPlayClick()">ИГРАТЬ</button>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="statusText">Готов к запуску</div>
    </div>

    <script>
        // Ссылка на ваш CDN список версий GitHub
        const GITHUB_MANIFEST = "https://raw.githubusercontent.com/Minoret1145/Horizon-CDN/main/versions.json";
        let loadedVersions = [];

        // 1. Загрузка списка версий из GitHub при запуске
        async function fetchVersions() {
            try {
                const response = await fetch(GITHUB_MANIFEST);
                const data = await response.json();
                loadedVersions = data.versions;

                const select = document.getElementById('versionSelect');
                select.innerHTML = '';

                if (loadedVersions && loadedVersions.length > 0) {
                    loadedVersions.forEach(ver => {
                        const opt = document.createElement('option');
                        opt.value = ver.id;
                        opt.innerText = ver.name || ver.id;
                        select.appendChild(opt);
                    });
                    document.getElementById('statusText').innerText = "Версии подгружены";
                } else {
                    select.innerHTML = '<option value="1.20.1">1.20.1 (Локальная)</option>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('statusText').innerText = "Ошибка GitHub! Использование локальной версии.";
                const select = document.getElementById('versionSelect');
                select.innerHTML = '<option value="1.20.1">1.20.1 (Default)</option>';
            }
        }

        // 2. Отправка сигнала на запуск в C++ (WebView2)
        function onPlayClick() {
            const username = document.getElementById('username').value.trim();
            const selectedId = document.getElementById('versionSelect').value;

            if (!username) return alert('Введите ник!');
            if (!selectedId) return alert('Выберите версию!');

            document.getElementById('playBtn').disabled = true;
            document.getElementById('statusText').innerText = "Проверка компонентов...";
            document.getElementById('progressBar').style.display = "block";
            document.getElementById('progressFill').style.width = "20%";

            // Отправляем сообщение в C++ окно
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(`launch|${username}|${selectedId}|4096`);
            } else {
                alert("WebView2 контекст не найден (запущено в обычном браузере)");
            }
        }

        // Функция обновления статуса из C++
        function updateStatus(message, percent) {
            document.getElementById('statusText').innerText = message;
            document.getElementById('progressFill').style.width = percent + "%";

            if (percent === 100 || percent === 0) {
                document.getElementById('playBtn').disabled = false;
            }
        }

        fetchVersions();
    </script>
</body>
</html>
