<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Horizon Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Inter', sans-serif; }
        body { background: #121811; color: #fff; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at center, #1b2818 0%, #0d120c 100%); }

        /* Top Bar */
        .top-bar { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(15, 22, 14, 0.6); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo-title { font-size: 13px; font-weight: 900; letter-spacing: 1.5px; color: #4ade80; display: flex; align-items: center; gap: 8px; }
        .user-panel { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 8px; background: #253322; border: 2px solid #38a169; object-fit: cover; }
        .username-input { background: transparent; border: none; color: #fff; font-size: 14px; font-weight: 700; outline: none; width: 110px; }
        .header-actions { display: flex; gap: 6px; }
        .icon-btn { width: 34px; height: 34px; background: #202b1c; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; color: #a7f3d0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .icon-btn:hover { background: #2e3e29; color: #fff; }

        /* Main Body */
        .main-container { flex: 1; display: flex; position: relative; padding: 20px; gap: 20px; }
        .left-menu { display: flex; flex-direction: column; gap: 12px; width: 140px; z-index: 5; }
        .widget-card { height: 70px; border-radius: 10px; background: linear-gradient(135deg, #7f1d1d, #991b1b); padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; }
        .widget-card.skin { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); }
        .widget-card.friends { background: linear-gradient(135deg, #14532d, #15803d); }
        .widget-title { font-size: 12px; font-weight: 800; color: #fff; }

        /* 3D Skin Area */
        .character-viewport { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .skin-render-box { width: 220px; height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .skin-img { height: 320px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); }

        /* Bottom Bar */
        .bottom-bar { height: 90px; padding: 0 30px; display: flex; align-items: center; justify-content: center; gap: 16px; background: rgba(10, 15, 9, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 10; }
        
        /* Выбор версий */
        .version-selector-box {
            height: 54px;
            background: #1f2b1d;
            border: 2px solid #2e422b;
            border-radius: 12px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 210px;
        }
        .version-icon { width: 32px; height: 32px; background: #15803d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .version-select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            outline: none;
            width: 100%;
            cursor: pointer;
        }
        .version-select option { background: #121811; color: #fff; font-weight: 600; }

        .launch-status-box { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 150px; }
        .status-text { font-size: 11px; font-weight: 600; color: #86efac; text-align: center; }
        .progress-bar { width: 100%; height: 6px; background: #1a2618; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: #22c55e; transition: width 0.2s; }

        .btn-play-main { height: 54px; padding: 0 45px; background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); border: none; border-bottom: 4px solid #15803d; border-radius: 12px; color: #052e16; font-size: 20px; font-weight: 900; cursor: pointer; }
        .btn-play-main:hover { transform: translateY(-2px); }
        .btn-cancel-main { background: linear-gradient(180deg, #f87171 0%, #dc2626 100%); border-bottom-color: #991b1b; color: #450a0a; }

        /* Modal Settings */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-card { width: 340px; background: #172015; border: 1px solid #2e422b; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .modal-title { font-size: 16px; font-weight: 800; color: #4ade80; }
        .form-group { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #cbd5e1; }
        .form-input { background: #0f160e; border: 1px solid #2e422b; padding: 8px 10px; border-radius: 6px; color: #fff; outline: none; }
        .modal-close-btn { padding: 10px; background: #22c55e; border: none; border-radius: 8px; font-weight: 800; color: #000; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-title"><span>⚡</span> HORIZON LAUNCHER</div>
        <div class="user-panel">
            <img class="user-avatar" id="userHead" src="https://mc-heads.net/avatar/PixelKate/64" />
            <input type="text" id="usernameInput" class="username-input" value="PixelKate">
        </div>
        <div class="header-actions">
            <div class="icon-btn" onclick="toggleSettings(true)" title="Настройки">⚙</div>
        </div>
    </div>

    <div class="main-container">
        <div class="left-menu">
