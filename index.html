<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Horizon Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body {
            background: #0b0d17;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 { color: #a855f7; text-align: center; }
        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #151828;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { font-size: 12px; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>HORIZON LAUNCHER</h2>
        
        <input type="text" id="username" value="Player" placeholder="Ваш ник">
        
        <select id="versionSelect">
            <option value="">Загрузка версий с GitHub...</option>
        </select>

        <button id="playBtn" onclick="onPlayClick()">ИГРАТЬ</button>
        
        <div class="status" id="statusText">Готов к запуску</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // Укажи здесь ссылку на твой Raw versions.json из Horizon-CDN
        const GITHUB_MANIFEST = const GITHUB_MANIFEST = "https://raw.githubusercontent.com/Minoret1145/Horizon-CDN/main/versions.json";
        let loadedVersions = [];

        // 1. Подгружаем доступные версии при старте
        async function fetchVersions() {
            try {
                const response = await fetch(GITHUB_MANIFEST);
                const data = await response.json();
                loadedVersions = data.versions;

                const select = document.getElementById('versionSelect');
                select.innerHTML = '';

                loadedVersions.forEach(ver => {
                    const opt = document.createElement('option');
                    opt.value = ver.id;
                    opt.innerText = ver.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                document.getElementById('statusText').innerText = "Ошибка загрузки манифеста!";
            }
        }

        // 2. Отправка сигнала на запуск в main.js
        function onPlayClick() {
            const username = document.getElementById('username').value.trim();
            const selectedId = document.getElementById('versionSelect').value;
            
            const versionConfig = loadedVersions.find(v => v.id === selectedId);

            if (!username) return alert('Введите ник!');
            if (!versionConfig) return alert('Выберите версию!');

            document.getElementById('playBtn').disabled = true;
            
            // Отправляем объект в main.js через IPC
            ipcRenderer.send('launch-game', { username, versionConfig });
        }

        // 3. Получение ответов и статусов от main.js
        ipcRenderer.on('status-update', (event, statusMessage) => {
            document.getElementById('statusText').innerText = statusMessage;
            
            if (statusMessage === 'Готов к запуску' || statusMessage.startsWith('Ошибка')) {
                document.getElementById('playBtn').disabled = false;
            }
        });

        fetchVersions();
    </script>
</body>
</html>
